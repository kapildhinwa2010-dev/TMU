[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmu-gpt2"
version = "0.1.1"
description = "Time Management Unit plugin for GPT-2 with external world time and internal AI/GPU clock"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TMU-GPT-2 Contributors" }]
keywords = [
  "pytorch",
  "transformers",
  "gpt2",
  "time-management",
  "temporal",
  "ai",
  "llm",
]
dependencies = [
  "torch>=2.0.0",
  "transformers>=4.38.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "black>=24.0",
  "ruff>=0.3.0",
]

[project.scripts]
tmu = "tmu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
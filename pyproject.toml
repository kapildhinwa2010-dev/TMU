[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmu-gpt2"
version = "0.2.0"
description = "Time Management Unit plugin for GPT-2 with external world time and internal AI/GPU clock"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TMU-GPT-2 Contributors" }]
keywords = [
  "pytorch",
  "transformers",
  "gpt2",
  "time-management",
  "temporal",
  "ai",
  "llm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.0.0",
  "transformers>=4.38.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "black>=24.0",
  "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/TMU"
Repository = "https://github.com/kapildhinwa2010-dev/TMU"
Issues = "https://github.com/kapildhinwa2010-dev/TMU/issues"

[project.scripts]
tmu = "tmu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py39"
exclude = ["research", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
# Re-export module: public names yahan se import hote hain.
"src/tmu/looping_advanced.py" = ["F401"]
# Scripts sys.path ko runtime me set karte hain (source layout support).
"scripts/*.py" = ["E402"]

[tool.black]
line-length = 110
target-version = ["py39"]
name: Train & Compare (GPT-2 vs GPT-2 + TMU)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "scripts/train_comparison.py"
      - "configs/**"
      - ".github/workflows/train.yml"

concurrency:
  group: train-compare
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Run equal-budget GPT-2 vs TMU training comparison
        run: |
          python scripts/train_comparison.py \
            --config configs/train_compare.json \
            --results results/tmu_vs_baseline.json \
            --readme README.md

      - name: Commit results + README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results README.md
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update equal-budget benchmark results (GPT-2 vs GPT-2+TMU) [skip ci]"
          git pull --rebase origin main
          git push
